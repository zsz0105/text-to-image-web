<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 文生图 · 印花设计</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部导航 -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🎨</span>
        <span class="logo-text">AI 文生图</span>
      </div>
      <div class="header-right">
        <span class="api-status" id="apiStatus">
          <span class="dot dot--gray"></span> 未配置 API
        </span>
        <button class="btn btn--outline btn--sm" onclick="openSettings()">⚙️ 设置</button>
      </div>
    </header>

    <main class="main">
      <!-- 左侧控制面板 -->
      <aside class="sidebar">
        <div class="panel">
          <h3 class="panel__title">✏️ 提示词</h3>
          <textarea
            id="prompt"
            class="textarea"
            placeholder="描述你想要的图案，例如：暗黑风格骷髅玫瑰，火焰背景，高对比度，T恤印花图案..."
            rows="6"
          ></textarea>
          <div class="char-count" id="charCount">0 / 500</div>

          <h3 class="panel__title" style="margin-top:20px">🚫 反向提示词 <span class="tip">（不想要的元素）</span></h3>
          <textarea
            id="negPrompt"
            class="textarea textarea--neg"
            placeholder="模糊，低质量，文字，水印..."
            rows="3"
          ></textarea>
        </div>

        <div class="panel">
          <h3 class="panel__title">🎛️ 参数设置</h3>

          <div class="form-row">
            <label>风格</label>
            <select id="style" class="select">
              <option value="">默认</option>
              <option value="暗黑风">暗黑风</option>
              <option value="国潮风">国潮风</option>
              <option value="赛博朋克">赛博朋克</option>
              <option value="水彩插画">水彩插画</option>
              <option value="波普艺术">波普艺术</option>
              <option value="街头涂鸦">街头涂鸦</option>
              <option value="日系动漫">日系动漫</option>
              <option value="欧美插画">欧美插画</option>
            </select>
          </div>

          <div class="form-row">
            <label>图片尺寸</label>
            <select id="size" class="select">
              <option value="1024x1024">1024×1024（正方形）</option>
              <option value="1024x1536">1024×1536（竖版）</option>
              <option value="1536x1024">1536×1024（横版）</option>
              <option value="512x512">512×512（小图）</option>
            </select>
          </div>

          <div class="form-row">
            <label>生成数量</label>
            <div class="count-control">
              <button class="count-btn" onclick="changeCount(-1)">−</button>
              <span id="countVal">1</span>
              <button class="count-btn" onclick="changeCount(1)">＋</button>
            </div>
          </div>

          <div class="form-row">
            <label>随机种子 <span class="tip">（-1 随机）</span></label>
            <input id="seed" type="number" class="input" value="-1" min="-1" />
          </div>
        </div>

        <!-- 快捷提示词 -->
        <div class="panel">
          <h3 class="panel__title">⚡ 快捷印花词</h3>
          <div class="tags">
            <span class="tag" onclick="appendTag('骷髅图案')">骷髅图案</span>
            <span class="tag" onclick="appendTag('火焰纹')">火焰纹</span>
            <span class="tag" onclick="appendTag('玫瑰花')">玫瑰花</span>
            <span class="tag" onclick="appendTag('龙纹')">龙纹</span>
            <span class="tag" onclick="appendTag('蝴蝶')">蝴蝶</span>
            <span class="tag" onclick="appendTag('荆棘')">荆棘</span>
            <span class="tag" onclick="appendTag('星座符文')">星座符文</span>
            <span class="tag" onclick="appendTag('烟雾效果')">烟雾效果</span>
            <span class="tag" onclick="appendTag('T恤胸前印花')">T恤胸前印花</span>
            <span class="tag" onclick="appendTag('白底透明背景')">白底透明背景</span>
            <span class="tag" onclick="appendTag('高对比度')">高对比度</span>
            <span class="tag" onclick="appendTag('细节精致')">细节精致</span>
          </div>
        </div>

        <button class="btn btn--primary btn--full" id="generateBtn" onclick="generate()">
          <span id="btnText">🚀 开始生成</span>
        </button>
      </aside>

      <!-- 右侧图片展示区 -->
      <section class="gallery-area">
        <div class="gallery-header">
          <h2 class="gallery-title">生成结果</h2>
          <div class="gallery-actions">
            <button class="btn btn--ghost btn--sm" onclick="clearGallery()">🗑️ 清空</button>
          </div>
        </div>

        <div id="gallery" class="gallery">
          <div class="gallery-empty" id="emptyState">
            <div class="empty-icon">🖼️</div>
            <p>在左侧输入提示词，点击「开始生成」</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal" onclick="closeSettings(event)">
    <div class="modal">
      <div class="modal__header">
        <h3>⚙️ API 配置</h3>
        <button class="modal__close" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal__body">
        <div class="form-row form-row--col">
          <label>API 服务商</label>
          <select id="apiProvider" class="select" onchange="onProviderChange()">
            <option value="aliyun">阿里云通义万象</option>
            <option value="tencent">腾讯云混元</option>
            <option value="zhipu">智谱 AI (CogView)</option>
            <option value="stability">Stability AI</option>
            <option value="custom">自定义接口</option>
          </select>
        </div>

        <div class="form-row form-row--col">
          <label>API Key</label>
          <input id="apiKey" type="password" class="input" placeholder="填入你的 API Key" />
          <span class="form-hint" id="keyHint">格式：sk-xxxxx</span>
        </div>

        <div id="customUrlRow" class="form-row form-row--col" style="display:none">
          <label>自定义接口地址</label>
          <input id="customUrl" type="text" class="input" placeholder="https://your-api.com/v1/images" />
        </div>

        <div class="modal__tip">
          <p>💡 API Key 仅保存在本地浏览器，不会上传任何服务器。</p>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" onclick="closeSettings()">取消</button>
        <button class="btn btn--primary" onclick="saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <!-- 图片预览弹窗 -->
  <div class="modal-overlay" id="previewModal" onclick="closePreview()">
    <div class="preview-modal">
      <img id="previewImg" src="" alt="预览" />
      <div class="preview-actions">
        <a id="downloadBtn" href="#" download class="btn btn--primary">⬇️ 下载图片</a>
        <button class="btn btn--ghost" onclick="closePreview()">关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
